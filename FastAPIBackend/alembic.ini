[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = newline
version_locations =
    %(here)s/migrations/versions
    %(here)s/migrations/versions/core
recursive_version_locations = false
myreid.migration_scope = core
sqlalchemy.url = sqlite:///./reid_system.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
